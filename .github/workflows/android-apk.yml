name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore stable signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.GABA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GABA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GABA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GABA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gabagrowth-release.jks"
            chmod 600 "$RUNNER_TEMP/gabagrowth-release.jks"
            echo "GABA_KEYSTORE_PATH=$RUNNER_TEMP/gabagrowth-release.jks" >> "$GITHUB_ENV"
            echo "GABA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "GABA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "GABA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "No stable signing secrets: building debug APK. Updates may require uninstall."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        run: gradle --no-daemon :app:assembleRelease
      - name: Build debug APK (fallback)
        if: steps.signing.outputs.enabled != 'true'
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GabaGrowth-Android-v4.2-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
