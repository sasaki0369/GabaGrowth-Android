name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore stable signing key (required)
        env:
          KEYSTORE_B64: ${{ secrets.GABA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GABA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GABA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GABA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing signing secret: $key"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gabagrowth-release.jks"
          chmod 600 "$RUNNER_TEMP/gabagrowth-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/gabagrowth-release.jks" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          echo "GABA_KEYSTORE_PATH=$RUNNER_TEMP/gabagrowth-release.jks" >> "$GITHUB_ENV"
          echo "GABA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "GABA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GABA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK signature and show Firebase SHA-1
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: GabaGrowth-Android-v2.7-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
